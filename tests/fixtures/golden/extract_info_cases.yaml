# Golden dataset for extract_info, checked against the real trimmed US index
# in tests/fixtures/teams_index/USIL.json. Every `expect`/`forbid` number is a
# real team verified to exist (or not exist) in that fixture.
#
# tags are used to break precision/recall down by failure category in
# scripts/eval_extraction.py.
- id: num_single
  question: "What was 14469's highest score?"
  expect: [14469]
  forbid: []
  tags: [numeric, possessive]

- id: num_multi
  question: "Compare 14469 and 21333"
  expect: [14469, 21333]
  forbid: []
  tags: [numeric, multi]

- id: num_hash
  question: "how did team #9295 do"
  expect: [9295]
  forbid: [14469]
  tags: [numeric, prefix]

- id: fp_how_headline
  question: "How many matches did 21333 win?"
  expect: [21333]
  forbid: [14469]
  tags: [false_positive_trap]

- id: fp_how_did
  question: "How did Robo Knights do at states?"
  expect: [9295, 16609]
  forbid: [14469]
  tags: [false_positive_trap, name]

- id: fp_single_letter
  question: "what does m do in auto"
  expect: []
  forbid: []
  tags: [stopword]

- id: name_exact
  question: "tell me about Robo Knights"
  expect: [9295, 16609]
  forbid: [9930, 33862]
  tags: [name, spacing]

- id: name_hyphen_union
  question: "tell me about Robo-Knights"
  expect: [9295, 9930, 16609, 33862]
  forbid: []
  tags: [name, punctuation, spacing_union]

- id: name_concat_union
