- id: multi_mixed
  # "team HOW's" resolves via the context-signal override (preceded by
  # "team") plus possessive-suffix stripping ("HOW's" -> "how" + "s" dropped)
  # -- see signal_team_prefix and guard_allcaps_question below for the
  # isolated cases.
  question: "What is team HOW's chances of beating Late Knights and the Titans?"
  expect: [4218, 5158, 9762, 14469, 19055, 31895]
  forbid: []
  tags: [multi, numeric_and_name]

- id: signal_team_prefix
