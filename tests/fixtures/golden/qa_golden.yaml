# Golden Q/A set. Every fact here is computed from the recorded fixture
# payloads by src/stats.py (see scripts/eval_answers.py), not hand-typed --
# ground truth can never drift from what the fixtures actually contain.
#
# `fixture` names the ftcscout fixture file used to seed the corpus for this
# question. `expect_type` drives what "required chunks" means for the
# retrieval eval (aggregation -> every match_granular chunk for team+season).

- id: high_score_14469_2022
  fixture: team_14469_2022.json
  team: 14469
  season: 2022
  region: All
  question: "What was 14469's highest match score in Powerplay?"
  expect_type: aggregation
  must_contain: ["306", "F-1"]
  must_not_contain: ["2025", "Decode"]

- id: award_count_14469_2022
  fixture: team_14469_2022.json
  team: 14469
  season: 2022
  region: All
  question: "How many awards has 14469 won in Powerplay?"
  expect_type: aggregation
  must_contain: ["3"]
  must_not_contain: []

- id: event_record_14469_2022
  fixture: team_14469_2022.json
